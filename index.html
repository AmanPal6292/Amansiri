<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRI TALK</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#071018;
overflow:hidden;
color:white;
}

.bg-main{
background:
radial-gradient(circle at top left, rgba(0,255,120,0.10), transparent 30%),
radial-gradient(circle at bottom right, rgba(0,255,150,0.08), transparent 30%),
#071018;
}
</style>
</head>

<body class="bg-main">

<div id="join-screen" class="h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">

<h1 class="text-center text-5xl font-black text-green-400 mb-2">
SIRI TALK
</h1>

<p class="text-center text-gray-400 mb-8">
Secure • Fast • Real-time
</p>

<div class="bg-[#0f1a22] border border-[#1d2b35] rounded-[30px] p-5 shadow-2xl">

<div class="space-y-5">

<input
id="name"
type="text"
placeholder="Enter your name"
class="w-full bg-[#081219] border border-[#22313b] rounded-2xl px-4 py-4 outline-none text-white">

<div id="phone-box">

<input
id="phone"
type="text"
placeholder="+91XXXXXXXXXX"
class="w-full bg-[#081219] border border-[#22313b] rounded-2xl px-4 py-4 outline-none text-white">

<button
onclick="sendOTP()"
class="w-full bg-green-500 text-black py-4 rounded-2xl font-black text-lg mt-5">
Send OTP
</button>

</div>

<div id="otp-box" class="hidden">

<input
id="otp"
type="text"
maxlength="6"
placeholder="Enter OTP"
class="w-full bg-[#081219] border border-[#22313b] rounded-2xl px-4 py-4 outline-none text-center tracking-[8px] text-xl text-white">

<button
onclick="verifyOTP()"
class="w-full bg-green-500 text-black py-4 rounded-2xl font-black text-lg mt-5">
Verify & Login
</button>

</div>

<div id="recaptcha-container"></div>

</div>

</div>

</div>

</div>

<div id="chat-screen" class="hidden h-screen flex flex-col">

<div class="bg-[#0f1a22] border-b border-[#1d2b35] px-4 py-4 flex items-center justify-between">

<div>
<h1 class="text-2xl font-black text-green-400">
SIRI TALK
</h1>

<p class="text-xs text-gray-400">
Realtime Chat
</p>
</div>

<button
onclick="logout()"
class="bg-red-500 px-4 py-2 rounded-xl text-sm font-bold">
Logout
</button>

</div>

<div id="chat-box" class="flex-1 overflow-y-auto px-4 py-4 space-y-4">

<div class="flex justify-start">
<div class="bg-[#111d25] border border-[#1d2b35] rounded-[22px] px-4 py-3 max-w-[80%]">
<div class="text-green-400 text-sm font-bold mb-1">
System
</div>
<div class="text-[15px]">
Welcome to SIRI TALK 🚀
</div>
</div>
</div>

</div>

<div class="bg-[#0f1a22] border-t border-[#1d2b35] p-3 flex gap-3">

<input
id="message"
type="text"
placeholder="Type message..."
class="flex-1 bg-[#081219] border border-[#22313b] rounded-full px-5 py-4 outline-none text-white">

<button
onclick="sendMessage()"
class="bg-green-500 w-14 h-14 rounded-full text-black text-2xl font-black">
➤
</button>

</div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDjwR6uPPL4qxJhFVwb2rPcbfz0rIoZuAg",
  authDomain: "chat-58fef.firebaseapp.com",
  databaseURL: "https://chat-58fef-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "chat-58fef",
  storageBucket: "chat-58fef.firebasestorage.app",
  messagingSenderId: "40301981187",
  appId: "1:40301981187:web:8a0efad79a57321c7be836"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

let currentUser = "";

window.onload = function () {

window.recaptchaVerifier =
new firebase.auth.RecaptchaVerifier(
'recaptcha-container',
{
size:'invisible'
}
);

};

function sendOTP(){

const name =
document.getElementById("name").value.trim();

const phone =
document.getElementById("phone").value.trim();

if(!name || !phone){
alert("Fill all fields");
return;
}

currentUser = name;

auth.signInWithPhoneNumber(
phone,
window.recaptchaVerifier
)

.then((confirmationResult)=>{

window.confirmationResult =
confirmationResult;

document.getElementById("phone-box")
.classList.add("hidden");

document.getElementById("otp-box")
.classList.remove("hidden");

alert("OTP Sent");

})

.catch((error)=>{

alert(error.message);

});

}

function verifyOTP(){

const otp =
document.getElementById("otp").value.trim();

if(!otp){
alert("Enter OTP");
return;
}

window.confirmationResult.confirm(otp)

.then(()=>{

document.getElementById("join-screen")
.classList.add("hidden");

document.getElementById("chat-screen")
.classList.remove("hidden");

})

.catch((error)=>{

alert("Invalid OTP");

});

}

function sendMessage(){

const input =
document.getElementById("message");

const text =
input.value.trim();

if(!text) return;

const box =
document.getElementById("chat-box");

const wrapper =
document.createElement("div");

wrapper.className =
"flex justify-end";

wrapper.innerHTML = `
<div class="bg-green-600 rounded-[22px] px-4 py-3 max-w-[80%]">
<div class="text-sm font-bold mb-1">${currentUser}</div>
<div class="text-[15px] break-words">${text}</div>
<div class="text-[10px] opacity-70 text-right mt-2">
${new Date().toLocaleTimeString([], {
hour:'2-digit',
minute:'2-digit'
})}
</div>
</div>
`;

box.appendChild(wrapper);

box.scrollTop = box.scrollHeight;

input.value = "";

}

document.getElementById("message")
.addEventListener("keypress",(e)=>{

if(e.key==="Enter"){
sendMessage();
}

});

function logout(){
auth.signOut().then(()=>{
location.reload();
});
}

</script>

</body>
</html>
